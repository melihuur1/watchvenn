name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The oldest Node version package.json "engines" allows, so CI proves the minimum works.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
